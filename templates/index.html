<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Intrusion Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cybersecurity Intrusion Detection</h1>
        <form action="/predict" method="post">
            <label for="network_packet_size">Network Packet Size:</label>
            <input type="number" id="network_packet_size" name="network_packet_size" step="0.01" required>

            <label for="protocol_type">Protocol Type:</label>
            <select id="protocol_type" name="protocol_type" required>
                <option value="ICMP">ICMP</option>
                <option value="TCP">TCP</option>
                <option value="UDP">UDP</option>
            </select>

            <label for="login_attempts">Login Attempts:</label>
            <input type="number" id="login_attempts" name="login_attempts" required>

            <label for="session_duration">Session Duration:</label>
            <input type="number" id="session_duration" name="session_duration" step="0.01" required>

            <label for="encryption_used">Encryption Used:</label>
            <select id="encryption_used" name="encryption_used" required>
                <option value="AES">AES</option>
                <option value="DES">DES</option>
            </select>

            <label for="ip_reputation_score">IP Reputation Score:</label>
            <input type="number" id="ip_reputation_score" name="ip_reputation_score" step="0.01" required>

            <label for="failed_logins">Failed Logins:</label>
            <input type="number" id="failed_logins" name="failed_logins" required>

            <label for="browser_type">Browser Type:</label>
            <select id="browser_type" name="browser_type" required>
                <option value="Chrome">Chrome</option>
                <option value="Edge">Edge</option>
                <option value="Firefox">Firefox</option>
                <option value="Safari">Safari</option>
                <option value="Unknown">Unknown</option>
            </select>

            <label for="unusual_time_access">Unusual Time Access:</label>
            <input type="number" id="unusual_time_access" name="unusual_time_access" required>

            <button type="submit">Predict</button>
        </form>

        <div id="result" class="result" style="display: none;">
            <h2>Prediction Result</h2>
            <p><strong>Prediction:</strong> <span id="prediction"></span></p>
            <p><strong>Probability of Attack:</strong> <span id="probability"></span></p>
        </div>
    </div>
</body>
</html>
